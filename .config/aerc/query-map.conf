# Virtual folders for the [Unified] notmuch account (see accounts.conf).
# The mirror (~/.mbsyncrc, kept local) only holds each account's INBOX, so
# these stay small; widen the mbsync Patterns and these queries together.

Unread = tag:unread and (folder:Personal/INBOX or folder:Gmail/INBOX)
All inboxes = folder:Personal/INBOX or folder:Gmail/INBOX
