# ~/.config/keyd/default.conf
#
# MacBook (Apple SPI keyboard) modifier rotation:
#   Command -> Control
#   Option  -> Super
#   Control -> Alt
#
# Deployed to /etc/keyd/default.conf by ~/.local/bin/keyd-mac-modifiers.
#
# [ids] matches the full device id (vendor:product:hash). The Apple SPI
# trackpad shares vendor:product 05ac:0281 with the keyboard, and a k: prefix
# does NOT exclude it (keyd treats any device with buttons as having keys),
# so the generated hash is required to match the keyboard alone.
# The id comes from keyd's own device table (see `keyd monitor` output; it is
# also logged at startup in `journalctl -u keyd`).
#
# keyd models modifiers as layers. Assigning a raw modifier key name
# (e.g. "leftcontrol") is deprecated and makes `keyd check` exit non-zero,
# so the rotation is expressed with layer(...) instead.

[ids]
05ac:0281:2bd1f3de

[main]
# Command -> Control
leftmeta  = layer(control)
rightmeta = layer(control)

# Option -> Super
leftalt  = layer(meta)
rightalt = layer(meta)

# Control -> Alt (the MacBook Air only has a left Control key)
leftcontrol = layer(alt)
