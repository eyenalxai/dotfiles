# ~/.config/keyd/default.conf
#
# MacBook (Apple SPI keyboard) modifier rotation:
#   Command -> Control
#   Option  -> Super
#   Control -> Alt
#
# Deployed to /etc/keyd/default.conf by ~/.local/bin/keyd-mac-modifiers.
# k: restricts this to the keyboard (the trackpad shares id 05ac:0281).
#
# keyd models modifiers as layers. Assigning a raw modifier key name
# (e.g. "leftcontrol") is deprecated and makes `keyd check` exit non-zero,
# so the rotation is expressed with layer(...) instead.

[ids]
k:05ac:0281

[main]
# Command -> Control
leftmeta  = layer(control)
rightmeta = layer(control)

# Option -> Super
leftalt  = layer(meta)
rightalt = layer(meta)

# Control -> Alt (the MacBook Air only has a left Control key)
leftcontrol = layer(alt)
