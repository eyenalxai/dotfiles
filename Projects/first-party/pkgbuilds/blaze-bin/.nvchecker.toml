# nvchecker configuration file.
# Run from this directory: nvchecker -c .nvchecker.toml
# Docs: https://nvchecker.readthedocs.io/
#
# blaze publishes dated releases (0.YYYYMMDD.N) to a canary channel first and
# promotes a tested canary to stable unchanged. This package follows canary:
# the channel pointer names the newest release that is not yanked, which is
# also what upstream's installer serves. Reading the pointer avoids GitHub's
# API rate limit, and tags that exist before their release archive does.

[blaze-bin]
source = "regex"
url = "https://blaze-releases.ix.dev/channels/canary"
regex = '^([0-9]+\.[0-9]+\.[0-9]+)$'
