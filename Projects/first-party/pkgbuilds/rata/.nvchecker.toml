# nvchecker configuration file.
# Run from this directory: nvchecker -c .nvchecker.toml
# Docs: https://nvchecker.readthedocs.io/
#
# The git source reads the tags with `git ls-remote`, so it needs no GitHub
# API token. The github source now requires one and returns 403 without it.

[rata]
source = "git"
git = "https://github.com/eyenalxai/rata.git"
prefix = "v"
