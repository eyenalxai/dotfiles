# nvchecker configuration file.
# Run from this directory: nvchecker -c .nvchecker.toml
# Docs: https://nvchecker.readthedocs.io/
#
# The repository is public; the git source returns every tag and nvchecker
# picks the highest one.

[vingroto]
source = "git"
git = "https://github.com/eyenalxai/vingroto.git"
prefix = "v"
