# nvchecker configuration file.
# Run from this directory: nvchecker -c .nvchecker.toml
# Docs: https://nvchecker.readthedocs.io/
#
# Upstream publishes stable, preview and nightly tags in one repository.
# Preview and nightly tags carry a suffix, so a plain release tag is
# `v<major>.<minor>.<patch>`; `include_regex` keeps only those and drops
# every prerelease channel.

[t3code-bin]
source = "github"
github = "pingdotgg/t3code"
use_max_tag = true
include_regex = '^v\d+\.\d+\.\d+$'
prefix = "v"
